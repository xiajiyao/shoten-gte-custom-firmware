name: Publish historical GTE releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-releases.yml
      - tools/publish_releases.py
      - release/v0.51-exp/RELEASE_NOTES.md
      - release/v0.52-exp/RELEASE_NOTES.md
      - release/v0.53-exp/RELEASE_NOTES.md
      - release/v0.54-exp/RELEASE_NOTES.md
      - release/v0.55-exp/RELEASE_NOTES.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify images and publish prereleases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/publish_releases.py
